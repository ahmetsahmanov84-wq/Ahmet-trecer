</style></head><body><main class="app"><div class="eyebrow">PERSONAL KPI TRACKER</div><div id="screen"></div></main><nav class="nav"><div class="navin" id="nav"></div></nav><div class="toast" id="toast"></div><script>
(()=>{'use strict';
const WEEK=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],DAY=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];const defaults=[
{id:'wake',name:'Подъём и 400 мл тёплой воды',detail:'Пн–Сб: 06:30; Вс: 07:30–08:00',kind:'check',days:[0,1,2,3,4,5,6],time:'06:30',target:1,unit:'',group:'Утро'},
{id:'supp_am',name:'Утренние БАДы',detail:'АЦЦ 600 мг; D3+K2 2 капли; B-комплекс 1; мультивитамин 1; омега-3 1 капсула',kind:'check',days:[0,1,2,3,4,5,6],time:'07:00',target:1,unit:'',group:'Нутрицевтики'},
{id:'study',name:'Учёба',detail:'Занятия 07:30–13:15',kind:'check',days:[1,2,3,4,5],time:'07:30',target:1,unit:'',group:'Учёба'},
{id:'strength',name:'Силовая тренировка',detail:'Пн/Ср/Пт 15:15–16:30; Вс 09:00–10:15',kind:'check',days:[0,1,3,5],time:'15:15',target:1,unit:'',group:'Спорт'},
{id:'cardio',name:'Кардио после силовой',detail:'20 минут: Пт 16:30; Вс 10:15',kind:'check',days:[0,5],time:'16:30',target:1,unit:'',group:'Спорт'},
{id:'steps',name:'Шаги',detail:'Ежедневная активность',kind:'number',days:[0,1,2,3,4,5,6],time:'18:30',target:10000,unit:'шагов',group:'Активность'},
{id:'water',name:'Водный баланс',detail:'2 000 мл, в дни силовой 3 000 мл',kind:'number',days:[0,1,2,3,4,5,6],time:'19:00',target:2000,unit:'мл',group:'Гидратация'},
{id:'supp_pm',name:'Вечерние БАДы',detail:'Магний глицинат 400 мг; АЦЦ 600 мг; омега-3 2-я капсула',kind:'check',days:[0,1,2,3,4,5,6],time:'22:00',target:1,unit:'',group:'Нутрицевтики'},
{id:'sleep',name:'Своевременный отбой',detail:'Цель 23:00–00:30; отметка до закрытия дня в 00:00',kind:'check',days:[0,1,2,3,4,5,6],time:'23:00',target:1,unit:'',group:'Восстановление'},
{id:'protein',name:'Белки',detail:'Дневная норма',kind:'number',days:[0,1,2,3,4,5,6],time:'20:30',target:160,unit:'г',group:'Питание'},
{id:'fat',name:'Жиры',detail:'Дневная норма',kind:'number',days:[0,1,2,3,4,5,6],time:'20:30',target:60,unit:'г',group:'Питание'},
{id:'carbs',name:'Углеводы',detail:'Дневная норма',kind:'number',days:[0,1,2,3,4,5,6],time:'20:30',target:250,unit:'г',group:'Питание'}];
const copy=x=>JSON.parse(JSON.stringify(x));const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const parseDate=s=>new Date(s+'T12:00:00');const shift=(s,n)=>{let d=parseDate(s);d.setDate(d.getDate()+n);return localDate(d)};const dow=s=>parseDate(s).getDay();const pct=(a,b)=>b?100*a/b:0;const format=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:1});const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clamp=n=>Math.min(100,Math.max(0,n));
let state={version:1,versions:[{from:'2000-01-01',items:copy(defaults)}],records:{},lastSeen:localDate()},tab='home',month=localDate().slice(0,7),selected=localDate(),db=null,saveChain=Promise.resolve();
function notify(s){const el=document.querySelector('#toast');el.textContent=s;el.style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.style.display='none',2600)}
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open('personal-kpi-tracker-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function load(){return new Promise((resolve,reject)=>{let tx=db.transaction('data','readonly'),r=tx.objectStore('data').get('state');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function persist(){const snapshot=copy(state);saveChain=saveChain.then(()=>new Promise((resolve,reject)=>{let tx=db.transaction('data','readwrite');tx.objectStore('data').put(snapshot,'state');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})).catch(e=>notify('Ошибка сохранения: '+e.message));return saveChain}
function configAt(date){return [...state.versions].filter(v=>v.from<=date).sort((a,b)=>b.from.localeCompare(a.from))[0]?.items||defaults}
function build(date){const items=copy(configAt(date).filter(x=>x.days.includes(dow(date))));const strength=items.some(x=>x.id==='strength');for(const item of items){if(item.id==='water'&&item.target===2000&&strength)item.target=3000;if(item.id==='wake'&&dow(date)===0&&item.time==='06:30')item.time='07:30'}return {date,items,values:{},closed:false}}
function ensure(date){if(!state.records[date])state.records[date]=build(date);return state.records[date]}
function closePast(){const today=localDate();let last=state.lastSeen||today;if(last>today)last=today;let count=0;while(last<today&&count<3660){const r=ensure(last);r.closed=true;r.closedAt=r.closedAt||today+'T00:00:00';last=shift(last,1);count++}for(const [d,r] of Object.entries(state.records)){if(d<today&&!r.closed){r.closed=true;r.closedAt=today+'T00:00:00'}}state.lastSeen=today;ensure(today)}
function completed(item,val){return item.kind==='check'?val===true:Number.isFinite(Number(val))&&val!==undefined&&val!==null&&val!==''&&Number(val)>=item.target}
function score(r){let done=r.items.filter(i=>completed(i,r.values[i.id])).length;return {done,total:r.items.length,percent:pct(done,r.items.length)}}
function status(p){return p>=95?['Отлично','#168568']:p>=80?['Хорошо','#579c2c']:p>=60?['Средне','#ca912b']:p>=40?['Слабо','#d86b29']:['Провал','#ce5c53']}
function periods(from,to){let result=[];for(let d=from;d<=to;d=shift(d,1)){if(d>localDate())break;result.push(ensure(d))}return result}
function aggregate(rs){let d=0,t=0;for(const r of rs){const s=score(r);d+=s.done;t+=s.total}return {done:d,total:t,percent:pct(d,t)}}
function currentWeek(){let t=localDate(),diff=(dow(t)+6)%7;return shift(t,-diff)}
function cardStats(title,s){return `<div class="card stat"><div class="muted">${title}</div><strong>${Math.round(s.percent)}%</strong><div class="muted">${s.done} из ${s.total}</div></div>`}
function renderHome(){let t=localDate(),r=ensure(t),s=score(r),w=aggregate(periods(currentWeek(),t)),m=aggregate(periods(t.slice(0,7)+'-01',t)),st=status(s.percent);return `<div class="head"><div><h1>Мой день</h1><div class="muted">${parseDate(t).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</div></div><span class="pill">Сегодня</span></div><section class="card hero"><div class="heroTop"><div><div class="muted">Общий KPI сегодня</div><div class="big">${Math.round(s.percent)}%</div><b>${st[0]}</b></div><div class="ring" style="--p:${s.percent}%"><span>${s.done}/${s.total}</span></div></div><div class="progress"><i style="width:${s.percent}%"></i></div><div class="muted">Успешный день: от 80%</div></section><div class="grid2">${cardStats('Текущая неделя',w)}${cardStats('Текущий месяц',m)}</div><section class="card"><div class="sectiontop"><h2>Мои задачи</h2><span class="pill">${s.done} / ${s.total}</span></div>${r.items.sort((a,b)=>a.time.localeCompare(b.time)).map(item=>taskHtml(item,r)).join('')||'<div class="blank">На сегодня задач нет</div>'}</section><div class="note">Значения сохраняются автоматически. В 00:00 день закрывается. Для сна отметь подготовку ко сну до полуночи.</div>`}
function taskHtml(item,r){let v=r.values[item.id],done=completed(item,v),target=item.target;return `<div class="task"><button class="tick ${done?'done':''}" ${item.kind==='number'?'style="visibility:hidden"':''} data-check="${escape(item.id)}" aria-label="Отметить выполнение" ${item.kind==='number'?'disabled':''}>${done?'✓':''}</button><div class="taskbody"><strong>${escape(item.name)}</strong><small>${escape(item.time)} · ${escape(item.detail)}${item.kind==='number'?' · цель '+format(target)+' '+escape(item.unit):''}</small></div>${item.kind==='number'?`<input class="num" type="number" inputmode="decimal" min="0" step="any" data-number="${escape(item.id)}" value="${v===undefined?'':escape(v)}" placeholder="0" aria-label="${escape(item.name)}">`:`<span class="tag ${done?'':'bad'}">${done?'Готово':'Не готово'}</span>`}</div>`}
function renderKpi(){let today=localDate(),week=periods(currentWeek(),today),monthRecords=periods(today.slice(0,7)+'-01',today),all=Object.values(state.records).filter(r=>r.date<=today);let ws=aggregate(week),ms=aggregate(monthRecords);return `<div class="head"><div><h1>Аналитика KPI</h1><div class="muted">Отдельные результаты по каждому показателю</div></div></div><div class="grid2">${cardStats('Неделя',ws)}${cardStats('Месяц',ms)}</div><section class="card"><h2>12 показателей · неделя</h2>${configAt(today).map(item=>{let relevant=week.flatMap(r=>r.items.filter(i=>i.id===item.id).map(i=>({i,r}))),done=relevant.filter(x=>completed(x.i,x.r.values[x.i.id])).length,total=relevant.length,p=pct(done,total);return `<div class="barrow"><span>${escape(item.name)}</span><div class="smallbar"><i style="width:${p}%"></i></div><b>${done}/${total}</b></div>`}).join('')}</section><section class="card"><h2>Последние 7 дней</h2>${periods(shift(today,-6),today).map(r=>{let s=score(r);return `<div class="barrow"><span>${escape(WEEK[dow(r.date)])}, ${r.date.slice(8)}</span><div class="smallbar"><i style="width:${s.percent}%;background:${status(s.percent)[1]}"></i></div><b>${Math.round(s.percent)}%</b></div>`}).join('')}</section><div class="note">Итоги считаются по фактически запланированным задачам, а не по среднему значению 12 KPI.</div>`}
function renderHistory(){let [year,mon]=month.split('-').map(Number),first=new Date(year,mon-1,1),offset=(first.getDay()+6)%7,days=new Date(year,mon,0).getDate(),cells=Array.from({length:offset},()=>'<div></div>').join('');for(let day=1;day<=days;day++){let date=`${month}-${String(day).padStart(2,'0')}`,future=date>localDate(),s=future?null:score(ensure(date)),cls=future?'':s.percent>=80?'success':s.percent>=60?'medium':'low';cells+=`<button class="calday ${cls} ${date===localDate()?'today':''}" data-day="${date}" ${future?'disabled':''}>${day}</button>`}let r=selected<=localDate()?ensure(selected):null,s=r?score(r):null;return `<div class="head"><div><h1>История</h1><div class="muted">Закрытые дни только для просмотра</div></div></div><section class="card"><div class="sectiontop"><button class="btn secondary" data-month="-1">‹</button><h2>${first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</h2><button class="btn secondary" data-month="1">›</button></div><div class="calendar">${DAY.map(x=>`<div class="muted" style="text-align:center">${x}</div>`).join('')}${cells}</div><p class="note">Зелёный — от 80%; жёлтый — 60–79%; красный — менее 60%.</p></section>${r?`<section class="card"><div class="sectiontop"><h2>${parseDate(selected).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</h2><span class="pill">${Math.round(s.percent)}% · ${r.closed?'Закрыт':'Сегодня'}</span></div>${r.items.map(i=>`<div class="task"><span style="color:${completed(i,r.values[i.id])?'#168568':'#ce5c53'}">${completed(i,r.values[i.id])?'✓':'○'}</span><div class="taskbody"><strong>${escape(i.name)}</strong><small>${i.kind==='number'?`${r.values[i.id]??'—'} / ${i.target} ${escape(i.unit)}`:escape(i.detail)}</small></div></div>`).join('')}</section>`:''}`}
function renderSettings(){let items=configAt(localDate());return `<div class="head"><div><h1>Настройки</h1><div class="muted">Расписание, цели и данные</div></div></div><section class="card"><h2>12 KPI и расписание</h2><div class="note">Изменения действуют с текущего открытого дня. Закрытые даты не меняются.</div>${items.map((i,index)=>`<div class="editor"><h3>${index+1}. ${escape(i.name)}</h3><label class="field">Название<input data-edit="name" data-id="${i.id}" value="${escape(i.name)}"></label><label class="field">Описание<input data-edit="detail" data-id="${i.id}" value="${escape(i.detail)}"></label><div class="grid2"><label class="field">Время<input type="time" data-edit="time" data-id="${i.id}" value="${escape(i.time)}"></label><label class="field">${i.kind==='number'?'Цель ('+escape(i.unit)+')':'Тип'}${i.kind==='number'?`<input type="number" min="0.01" step="any" data-edit="target" data-id="${i.id}" value="${i.target}">`:'<input disabled value="Выполнено / нет">'}</label></div><div class="week">${DAY.map((d,j)=>{let day=(j+1)%7;return `<label><input type="checkbox" data-edit-day="${day}" data-id="${i.id}" ${i.days.includes(day)?'checked':''}>${d}</label>`}).join('')}</div></div>`).join('')}<button class="btn" id="save-settings">Сохранить изменения</button></section><section class="card"><h2>Данные и резервные копии</h2><div class="controls"><button class="btn" id="export-json">Скачать JSON</button><button class="btn secondary" id="export-csv">Скачать CSV</button></div><label class="field">Восстановить из JSON<input type="file" accept=".json,application/json" id="import-json"></label><p class="note">Импорт заменяет все текущие данные после подтверждения. Храните резервную копию в «Файлах» или iCloud Drive.</p></section><section class="card"><h2>Правила</h2><p class="note">Успешный день: от 80%. Пять уровней оценки. KPI засчитывается только при полном выполнении. Незаполненные задачи считаются невыполненными. Прошедшие дни закрываются в 00:00. БЖУ: достижение или превышение цели.</p></section>`}
function nav(){let buttons=[['home','⌂','Главная'],['kpi','▥','KPI'],['history','▦','История'],['settings','⚙','Настройки']];document.querySelector('#nav').innerHTML=buttons.map(([id,ico,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}"><b>${ico}</b>${label}</button>`).join('')}
function render(){closePast();let el=document.querySelector('#screen');el.innerHTML=tab==='home'?renderHome():tab==='kpi'?renderKpi():tab==='history'?renderHistory():renderSettings();nav();persist()}
function updateConfig(items){let today=localDate();state.versions=state.versions.filter(v=>v.from!==today);state.versions.push({from:today,items});state.versions.sort((a,b)=>a.from.localeCompare(b.from));let old=ensure(today),fresh=build(today);fresh.values=old.values;state.records[today]=fresh}
function saveSettings(){let items=copy(configAt(localDate()));for(let i of items){for(let f of ['name','detail','time','target']){let input=document.querySelector(`[data-edit="${f}"][data-id="${i.id}"]`);if(!input)continue;let v=f==='target'?Number(input.value):input.value.trim();if(f==='target'&&(!Number.isFinite(v)||v<=0)){notify('Цель должна быть больше нуля');return}if(f==='name'&&!v){notify('Название не может быть пустым');return}i[f]=v}i.days=[...document.querySelectorAll(`[data-edit-day][data-id="${i.id}"]:checked`)].map(x=>Number(x.dataset.editDay))}updateConfig(items);render();notify('Изменения сохранены')}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function csv(){let rows=[['Дата','KPI ID','Название','Цель','Единица','Факт','Выполнено','День закрыт']];for(let r of Object.values(state.records).sort((a,b)=>a.date.localeCompare(b.date)))for(let i of r.items)rows.push([r.date,i.id,i.name,i.target,i.unit,i.kind==='check'?(r.values[i.id]===true?'Да':'Нет'):(r.values[i.id]??''),completed(i,r.values[i.id])?'100':'0',r.closed?'Да':'Нет']);return '\ufeff'+rows.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n')}
function validateImport(obj){if(!obj||!Array.isArray(obj.versions)||!obj.versions.length||typeof obj.records!=='object'||!obj.records||Array.isArray(obj.records))throw Error('Неверная структура JSON');for(let v of obj.versions){if(typeof v.from!=='string'||!Array.isArray(v.items)||v.items.length>100)throw Error('Повреждены настройки');for(let i of v.items)if(!i.id||!i.name||!Array.isArray(i.days)||!['check','number'].includes(i.kind))throw Error('Неверный KPI')}for(let [date,r] of Object.entries(obj.records)){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!r||!Array.isArray(r.items)||typeof r.values!=='object')throw Error('Повреждена история')}return true}
document.addEventListener('click',e=>{let tabButton=e.target.closest('[data-tab]');if(tabButton){tab=tabButton.dataset.tab;render();window.scrollTo(0,0);return}let check=e.target.closest('[data-check]');if(check){let r=ensure(localDate());if(r.closed)return;r.values[check.dataset.check]=!r.values[check.dataset.check];render();return}let day=e.target.closest('[data-day]');if(day){selected=day.dataset.day;render();return}let monthButton=e.target.closest('[data-month]');if(monthButton){let [y,m]=month.split('-').map(Number);let d=new Date(y,m-1+Number(monthButton.dataset.month),1);month=localDate(d).slice(0,7);render();return}if(e.target.id==='save-settings'){saveSettings();return}if(e.target.id==='export-json'){download('personal-kpi-backup-'+localDate()+'.json',JSON.stringify(state,null,2),'application/json');return}if(e.target.id==='export-csv'){download('personal-kpi-'+localDate()+'.csv',csv(),'text/csv;charset=utf-8');return}});
document.addEventListener('change',async e=>{if(e.target.matches('[data-number]')){let r=ensure(localDate());if(r.closed)return;let v=e.target.value;if(v!==''&&(!Number.isFinite(Number(v))||Number(v)<0)){notify('Введите число от 0');return}if(v==='')delete r.values[e.target.dataset.number];else r.values[e.target.dataset.number]=Number(v);render()}if(e.target.id==='import-json'){let f=e.target.files?.[0];if(!f)return;try{let incoming=JSON.parse(await f.text());validateImport(incoming);if(!confirm('Заменить все текущие данные резервной копией?'))return;state=incoming;closePast();await persist();tab='home';render();notify('Резервная копия восстановлена')}catch(err){notify('Ошибка импорта: '+err.message)}}});
(async()=>{try{db=await openDb();let stored=await load();if(stored){validateImport(stored);state=stored}closePast();render();setInterval(()=>{let t=localDate();if(state.lastSeen!==t){closePast();render()}},10000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>notify('Не удалось включить офлайн-кэш'))}catch(e){document.querySelector('#screen').innerHTML=`<section class="card"><h2>Хранилище недоступно</h2><p>Разрешите хранение данных в браузере и откройте приложение повторно.</p><p class="note">${escape(e.message)}</p></section>`}})();
})();
</script></body></html>
